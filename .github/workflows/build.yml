name: Build and Release Windows Installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - refactor/modular-v18.7
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Compile all Python modules
        run: python -m compileall -q building_manager main.py

      - name: Run core smoke tests
        run: |
          python -c "from building_manager.entrypoint import _self_test_jalali, _self_test_parse_money, _self_test_migrate_income_backfill, _validate_raw_i18n; _self_test_jalali(); _self_test_parse_money(); _self_test_migrate_income_backfill(); _validate_raw_i18n(); print('Core smoke tests passed')"

      - name: Build application directory
        run: |
          pyinstaller --noconfirm --clean --onedir --windowed --name BuildingManager --collect-all reportlab --collect-all openpyxl --collect-all arabic_reshaper --collect-all bidi main.py

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build Setup.exe
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: BuildingManager-Windows-18.7
          path: |
            dist/BuildingManager_Setup.exe
            dist/BuildingManager/
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: BuildingManager ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/BuildingManager_Setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
